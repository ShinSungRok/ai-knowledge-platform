services:
  postgres:
    image: postgres:16
    container_name: ai-knowledge-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-knowledge}
      - POSTGRES_USER=${POSTGRES_USER:-knowledge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-knowledge}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ai-knowledge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: ai-knowledge-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Knowledge_Admin1!}
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - ai-knowledge-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  ai-knowledge-network:
    driver: bridge

volumes:
  postgres-data:
  opensearch-data:
