services:
  # InMemory host by default (no Postgres/OpenSearch required).
  #   docker compose -f docker/docker-compose.yml up app --build
  # Full stack (Postgres SoT + OpenSearch VectorIndex):
  #   docker compose -f docker/docker-compose.yml --profile full up app-full postgres opensearch --build
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-knowledge-app
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - API_KEY=${API_KEY:-demo-key}
      - API_KEY_SUBJECT=${API_KEY_SUBJECT:-demo-user}
      - WORKSPACE_ID=${WORKSPACE_ID:-workspace-a}
      # Optional: set DATABASE_URL / OPENSEARCH_URL / LLM_API_KEY via .env
      # when postgres/opensearch (or external) are reachable on the network.
    networks:
      - ai-knowledge-network

  app-full:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-knowledge-app-full
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - API_KEY=${API_KEY:-demo-key}
      - API_KEY_SUBJECT=${API_KEY_SUBJECT:-demo-user}
      - WORKSPACE_ID=${WORKSPACE_ID:-workspace-a}
      - DATABASE_URL=postgres://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-knowledge}@postgres:5432/${POSTGRES_DATABASE:-knowledge}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_INDEX=${OPENSEARCH_INDEX:-knowledge-embeddings}
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - ai-knowledge-network

  postgres:
    image: postgres:16
    container_name: ai-knowledge-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-knowledge}
      - POSTGRES_USER=${POSTGRES_USER:-knowledge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-knowledge}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ai-knowledge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: ai-knowledge-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Knowledge_Admin1!}
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - ai-knowledge-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  ai-knowledge-network:
    driver: bridge

volumes:
  postgres-data:
  opensearch-data:
